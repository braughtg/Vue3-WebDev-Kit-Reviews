<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="app.js" defer></script>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <div id="app" v-cloak>
      <h1>FlashWord</h1>

      <p v-if="completed" id="completed">
        Good work, you have completed all the words!
      </p>
      <p v-else id="correctCount">
        You have answered {{ correctCount }} out of {{ wordCount }}
      </p>

      <div id="cards">
        <div
          class="card"
          v-for="word in shuffledWords"
          v-bind:class="{correct: word.correct}"
        >
          <p class="word">{{ word.word_a }}</p>
          <input
            type="text"
            v-if="!word.correct"
            v-model="word.answer"
            v-on:keyup.enter="checkAnswer(word)"
          />
          <p v-else class="correctAnswer">{{ word.answer }}</p>
        </div>
      </div>
    </div>
  </body>
</html>
